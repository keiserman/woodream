# A product configurator page at /products/3-piece-bookshelf (the file name is the slug).
#
# Options render top to bottom, and their layers stack in the same order, so a
# later option paints over an earlier one.
#
# - price: added to the estimate while the choice is selected.
# - layer: transparent image shown over the base while the choice is selected.
# - selected: picked when the page loads.
# - showWhen: only offer this option while another one has the given choice.
#   That other option must be listed earlier in this file.
#
# Option names and choice labels are what the shop sees in form submissions.

name: 3-piece Bookshelf
base: ./3-piece-bookshelf/base.webp

options:
  - name: Wood
    label: Type of Wood
    badge: Not shown in preview
    woodDetails: true
    choices:
      - { label: Maple, price: 2500, selected: true }
      - { label: Oak, price: 3000 }
      - { label: Walnut, price: 3525 }

  - name: Glass
    label: Middle Glass Doors and Shelves
    badge: Will need bottom doors
    choices:
      - { label: 'No' }
      - { label: 'Yes', price: 250, layer: ./3-piece-bookshelf/middle-glass.webp }

  - name: Mirrors
    label: Mirror Back Wall
    badge: Not shown in preview
    showWhen: { option: Glass, is: 'Yes' }
    choices:
      - { label: 'No' }
      - { label: 'Yes', price: 300 }

  - name: Doors
    label: Bottom Doors
    choices:
      - { label: 'No' }
      - { label: 'Yes', price: 250, layer: ./3-piece-bookshelf/doors.webp }

  - name: Shaker Design
    label: Flat/Shaker Doors
    showWhen: { option: Doors, is: 'Yes' }
    choices:
      - { label: Flat }
      - { label: Shaker, price: 150, layer: ./3-piece-bookshelf/shaker.webp }

  - name: Door Design
    label: Flat Door Design
    showWhen: { option: Shaker Design, is: Flat }
    choices:
      - { label: Plain }
      - { label: Fluted, price: 250, layer: ./3-piece-bookshelf/fluted.webp }
      - { label: Etched, layer: ./3-piece-bookshelf/etched.webp }

  - name: Etched Design
    label: Etched Door Design
    showWhen: { option: Door Design, is: Etched }
    choices:
      - { label: Double Stripe }
      - { label: Border, layer: ./3-piece-bookshelf/etched-border.webp }
      - { label: Double Border }

  - name: Door Type
    label: Door Shaker Design
    showWhen: { option: Shaker Design, is: Shaker }
    choices:
      - { label: Single }
      - { label: Double, layer: ./3-piece-bookshelf/shaker-double.webp }

  - name: Hardware
    label: Hardware
    badge: Choose in store
    showWhen: { option: Doors, is: 'Yes' }
    choices:
      - { label: 'Yes', layer: ./3-piece-bookshelf/hardware.webp }
      - { label: Push to open }

  - name: Moldings
    label: Top moldings
    choices:
      - { label: Modern, layer: ./3-piece-bookshelf/molding-modern.webp }
      - { label: Classic Crown }
      - { label: Center Line }
      - { label: Etched Stripes, layer: ./3-piece-bookshelf/molding-etched-stripes.webp }
      - { label: Single Crown, layer: ./3-piece-bookshelf/molding-single-crown.webp }
      - { label: Double Crown, layer: ./3-piece-bookshelf/molding-double-crown.webp }

  - name: Columns
    label: Columns
    choices:
      - { label: Modern, layer: ./3-piece-bookshelf/columns-modern.webp }
      - { label: Classic, layer: ./3-piece-bookshelf/columns-classic.webp }
      - { label: Center Indent, layer: ./3-piece-bookshelf/columns-center-indent.webp }
      - { label: Etched Stripes, layer: ./3-piece-bookshelf/columns-etched-stripes.webp }

  - name: Gold Inlays
    label: Gold Inlays
    badge: Not shown in Preview
    choices:
      - { label: 'No' }
      - { label: Top molding only, price: 350 }
      - { label: Top molding and soffits, price: 500 }

  - name: Stain Color
    label: Stain Color Chosen in store
