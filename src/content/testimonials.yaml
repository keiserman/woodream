- id: not-just-furniture
  order: 1
  quote: >-
    You can tell right away that this isn’t just about building furniture for them. They want to know who you
    are, how you live, and exactly what you have in mind. They find out what matters to you and then they make
    it matter to them, too.

- id: only-project
  order: 2
  quote: >-
    When I worked with Woodream, it honestly felt like I was their only project. Every call, every meeting, they
    gave me their full attention. Then I walked into the shop one day and saw a dozen other pieces in
    progress—and realized just how many people they make feel that way.

- id: dining-table
  order: 3
  quote: >-
    We’d been hunting for the perfect dining table for months—stores, online, you name it. Nothing felt right,
    and the few we liked were way out of budget. Finally, we decided to have Woodream make it custom. Best
    decision ever. Not only is it exactly what we wanted, it’s more beautiful than anything we saw in the
    stores… and it ended up costing less.

- id: designer-study
  order: 4
  quote: >-
    As a designer, I’m picky—sometimes too picky. I had a very specific vision for my client’s study, and with
    Woodream doing everything in-house, there were no lost details, no miscommunications. What I pictured in my
    head is exactly what showed up in the room.
